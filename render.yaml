# Free-tier deployment configuration. Render free Postgres expires after 30 days;
# upgrade the database before that date for a persistent production database.
services:
  - type: web
    name: chaos2commit-business-transformation
    runtime: node
    repo: https://github.com/Jiyabhaviksadaria/chaos2commit_Business-Transformation
    branch: main
    plan: free
    region: oregon
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaos2commit-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_VERSION
        value: 24.15.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: AI_MOCK
        value: "false"

databases:
  - name: chaos2commit-db
    databaseName: chaos2commit
    user: chaos2commit
    postgresMajorVersion: "16"
    plan: free
    region: oregon
